name: jobwatch

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours: 05:47, 11:47, 17:47, 23:47 IST
  workflow_dispatch:            # lets you press "Run workflow" manually

permissions:
  contents: write

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run jobwatch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
        run: python -m jobwatch.main

      - name: Save state back to the repo
        run: |
          git config user.name "jobwatch-bot"
          git config user.email "jobwatch-bot@users.noreply.github.com"
          git add state output
          git diff --cached --quiet || git commit -m "jobwatch: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
